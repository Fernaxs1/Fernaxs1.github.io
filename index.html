<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humedalert</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-6">

    <div class="w-full max-w-4xl">
        <!-- Encabezado con Imagen y Título -->
        <header class="flex justify-between items-center mb-8 bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700">
            <div class="flex items-center space-x-4">
                <!-- Reemplaza 'logo.png' por el nombre exacto de tu archivo de imagen -->
                <img src="C:\Users\ferna\Desktop\humedalert\Imagen_de_WhatsApp_2025-06-23_a_las_23.54.13_c30eb867-removebg-preview.png" alt="Logo Humedalert" class="w-12 h-12 object-contain rounded-xl">
                <div>
                    <h1 class="text-2xl font-bold text-emerald-400">Humedalert</h1>
                    <p class="text-sm text-slate-400">Monitoreo en tiempo real vía Web</p>
                </div>
            </div>
            
            <button id="connectBtn" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold px-5 py-2.5 rounded-xl transition shadow-md">
                Conectar Puerto Serial
            </button>
        </header>

        <!-- Tarjetas de Métricas (Ajustadas a 3 columnas) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <!-- Humedad de Suelo -->
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-md">
                <span class="text-slate-400 text-sm font-medium">Humedad de Suelo</span>
                <div class="text-3xl font-bold text-emerald-400 mt-2"><span id="humedad_suelo">--</span>%</div>
                <div class="w-full bg-slate-700 h-2 rounded-full mt-4 overflow-hidden">
                    <div id="suelo_bar" class="bg-emerald-400 h-full w-0 transition-all duration-300"></div>
                </div>
            </div>

            <!-- Temperatura del Aire -->
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-md">
                <span class="text-slate-400 text-sm font-medium">Temperatura Aire</span>
                <div class="text-3xl font-bold text-amber-400 mt-2"><span id="temperatura_aire">--</span> °C</div>
                <span class="text-xs text-slate-500 mt-4 block">Sensor DHT22</span>
            </div>

            <!-- Humedad del Aire -->
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-md">
                <span class="text-slate-400 text-sm font-medium">Humedad Aire</span>
                <div class="text-3xl font-bold text-indigo-400 mt-2"><span id="humedad_aire">--</span>%</div>
                <span class="text-xs text-slate-500 mt-4 block">Sensor DHT22</span>
            </div>
        </div>

        <!-- Panel de Recomendaciones de Riego -->
        <div id="recomendacionCard" class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-md mb-8 transition-colors duration-300">
            <div class="flex items-center space-x-3">
                <div id="recIcon" class="text-3xl">🌱</div>
                <div>
                    <h2 class="text-lg font-bold text-slate-200">Recomendación de Riego</h2>
                    <p id="recomendacionText" class="text-slate-400 text-sm mt-1">Esperando datos de los sensores para evaluar el estado del sustrato...</p>
                </div>
            </div>
        </div>

        <!-- Consola de Log -->
        <div class="bg-slate-950 p-5 rounded-2xl border border-slate-800 shadow-inner">
            <div class="flex justify-between items-center mb-3">
                <span class="text-xs font-mono uppercase tracking-wider text-slate-400">Log de Datos (JSON)</span>
                <span id="estado" class="text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 font-medium">Desconectado</span>
            </div>
            <pre id="log" class="text-xs font-mono text-slate-300 h-36 overflow-y-auto whitespace-pre-wrap bg-slate-900/50 p-3 rounded-lg border border-slate-800/80"></pre>
        </div>
    </div>

    <script>
        const connectBtn = document.getElementById('connectBtn');
        const logEl = document.getElementById('log');
        const estadoEl = document.getElementById('estado');
        
        const humedadSuEl = document.getElementById('humedad_suelo');
        const tempAirEl = document.getElementById('temperatura_aire');
        const humAirEl = document.getElementById('humedad_aire');
        const sueloBar = document.getElementById('suelo_bar');

        const recomendacionCard = document.getElementById('recomendacionCard');
        const recomendacionText = document.getElementById('recomendacionText');
        const recIcon = document.getElementById('recIcon');

        let port;
        let reader;

        function actualizarRecomendacion(pct) {
            if (pct < 30) {
                recomendacionCard.className = "bg-red-950/40 p-6 rounded-2xl border border-red-800/60 shadow-md mb-8 transition-colors duration-300";
                recIcon.textContent = "🚨";
                recomendacionText.innerHTML = `<strong class="text-red-400">¡Alerta de sequedad! El suelo está muy seco (${pct}%).</strong> Es altamente recomendable activar el riego de inmediato para evitar estrés hídrico en las plantas.`;
            } else if (pct >= 30 && pct <= 70) {
                recomendacionCard.className = "bg-slate-800 p-6 rounded-2xl border border-emerald-600/40 shadow-md mb-8 transition-colors duration-300";
                recIcon.textContent = "✅";
                recomendacionText.innerHTML = `<strong class="text-emerald-400">Nivel de humedad óptimo (${pct}%).</strong> El sustrato se encuentra en buenas condiciones. No es necesario regar por el momento.`;
            } else {
                recomendacionCard.className = "bg-blue-950/40 p-6 rounded-2xl border border-blue-800/60 shadow-md mb-8 transition-colors duration-300";
                recIcon.textContent = "💧";
                recomendacionText.innerHTML = `<strong class="text-blue-400">Suelo demasiado húmedo o encharcado (${pct}%).</strong> Evita regar en los próximos días para prevenir la pudrición de raíces por exceso de agua.`;
            }
        }

        connectBtn.addEventListener('click', async () => {
            if (port) {
                // Desconectar
                try {
                    if (reader) {
                        await reader.cancel();
                        await reader.releaseLock();
                    }
                    await port.close();
                } catch (e) {
                    console.error(e);
                }
                port = null;
                connectBtn.textContent = "Conectar Puerto Serial";
                connectBtn.className = "bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold px-5 py-2.5 rounded-xl transition shadow-md";
                estadoEl.textContent = "Desconectado";
                estadoEl.className = "text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 font-medium";
                return;
            }

            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });

                connectBtn.textContent = "Desconectar";
                connectBtn.className = "bg-rose-500 hover:bg-rose-600 text-white font-semibold px-5 py-2.5 rounded-xl transition shadow-md";
                estadoEl.textContent = "Conectado";
                estadoEl.className = "text-xs px-2.5 py-1 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800 font-medium";

                const textDecoder = new TextDecoderStream();
                const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
                reader = textDecoder.readable.getReader();

                let buffer = "";
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += value;
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); // Mantener la última línea incompleta en el búfer

                    for (const line of lines) {
                        const cleanLine = line.trim();
                        if (!cleanLine) continue;

                        logEl.textContent += cleanLine + "\n";
                        logEl.scrollTop = logEl.scrollHeight;

                        try {
                            const data = JSON.parse(cleanLine);
                            if (data.estado === "ok") {
                                const pct = data.humedad_suelo;
                                humedadSuEl.textContent = pct;
                                tempAirEl.textContent = data.temperatura_aire;
                                humAirEl.textContent = data.humedad_aire;
                                
                                // Actualizar barra de progreso
                                sueloBar.style.width = pct + "%";

                                // Actualizar tarjeta de recomendaciones
                                actualizarRecomendacion(pct);
                            }
                        } catch (e) {
                            // Ignorar si la línea no es un JSON válido
                        }
                    }
                }
            } catch (error) {
                console.error("Error en puerto serial:", error);
                estadoEl.textContent = "Error de conexión";
                estadoEl.className = "text-xs px-2.5 py-1 rounded-full bg-red-950 text-red-400 border border-red-800 font-medium";
            }
        });
    </script>
</body>
</html>
